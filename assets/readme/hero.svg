<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">ARAH Harness — TechOrganism</title>
  <desc id="desc">Agent Runtime Autonomous Harness that turns any repository into a TechOrganism: discover, cells, signals, evolve — with humans merging via pull request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C0F"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1210"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0E141B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3EE0C8"/>
      <stop offset="100%" stop-color="#0A7A5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#1E2630" stroke-width="1"/>
  <g opacity="0.18" stroke="#2A3340" stroke-width="1" fill="none">
    <circle cx="980" cy="190" r="118"/>
    <circle cx="980" cy="190" r="78"/>
    <path d="M862 190 H1098 M980 72 V308"/>
  </g>
  <g id="title-block" transform="translate(56 48)">
    <text x="0" y="0" fill="#5A6675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">OPEN-SOURCE KERNEL · v0.4.4</text>
    <text x="0" y="62" fill="#E7ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700">ARAH Harness</text>
    <text x="0" y="108" fill="#3EE0C8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="600">TechOrganism</text>
    <text x="0" y="162" fill="#9AA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">
      <tspan x="0" dy="0">Transforma qualquer repositório em um</tspan>
      <tspan x="0" dy="32">organismo de agentes — coreografado,</tspan>
      <tspan x="0" dy="32">auditável e evolutivo.</tspan>
    </text>
    <text x="0" y="278" fill="#5A6675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">agentes propõem  ·  humanos fazem merge</text>
  </g>
  <g id="project-proof" transform="translate(720 44)">
    <rect width="420" height="292" rx="18" fill="url(#panel)" stroke="#232B36"/>
    <text x="28" y="40" fill="#5A6675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">CYCLE</text>
    <g transform="translate(352 16)" stroke="#3EE0C8" stroke-width="1.6" fill="none">
      <circle cx="24" cy="16" r="14" opacity="0.35"/>
      <circle cx="8" cy="10" r="3.5" fill="#3EE0C8" stroke="none"/>
      <circle cx="40" cy="10" r="3.5" fill="#3EE0C8" stroke="none" opacity="0.7"/>
      <circle cx="24" cy="26" r="3.5" fill="#0A7A5A" stroke="none"/>
      <path d="M8 10 L24 26 L40 10" opacity="0.45"/>
    </g>
    <text x="28" y="72" fill="#E7ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">discover → evolve</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <rect x="28" y="100" width="168" height="48" rx="10" fill="#0A0C0F" stroke="#0A7A5A"/>
      <circle cx="48" cy="124" r="6" fill="url(#teal)"/>
      <text x="66" y="130" fill="#E7ECF1">discover</text>
      <rect x="224" y="100" width="168" height="48" rx="10" fill="#0A0C0F" stroke="#2A3340"/>
      <circle cx="244" cy="124" r="6" fill="#3EE0C8" opacity="0.85"/>
      <text x="262" y="130" fill="#E7ECF1">cells</text>
      <rect x="28" y="172" width="168" height="48" rx="10" fill="#0A0C0F" stroke="#2A3340"/>
      <circle cx="48" cy="196" r="6" fill="#3EE0C8" opacity="0.65"/>
      <text x="66" y="202" fill="#E7ECF1">signals</text>
      <rect x="224" y="172" width="168" height="48" rx="10" fill="#0A0C0F" stroke="#2A3340"/>
      <circle cx="244" cy="196" r="6" fill="#3EE0C8" opacity="0.5"/>
      <text x="262" y="202" fill="#E7ECF1">evolve</text>
    </g>
    <text x="28" y="262" fill="#5A6675" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">PR → CI → ready-for-merge</text>
  </g>
</svg>
