  <text x="68" y="102" fill="#E7ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700">CLI</text>
  <text x="68" y="148" fill="#9AA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">cli/arah.ps1 — bootstrap e homeostase.</text>

