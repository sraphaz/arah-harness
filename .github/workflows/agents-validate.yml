name: Agents Validate

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.skills/**'
      - 'AGENTS.md'
      - 'arah.config.yaml'
      - 'scripts/agents/**'
      - 'scripts/harness/**'
      - 'docs/specs/**'
      - 'docs/_meta/**'
      - 'schemas/**'
      - 'docs/schemas/**'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.skills/**'
      - 'AGENTS.md'
      - 'arah.config.yaml'
      - 'scripts/agents/**'
      - 'scripts/harness/**'
      - 'docs/specs/**'
      - 'docs/_meta/**'
      - 'schemas/**'
      - 'docs/schemas/**'

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate agent & skill manifests
        shell: pwsh
        run: ./scripts/agents/validate-manifests.ps1
      - name: Dry-run emit-execution-evidence (contrato v1)
        shell: pwsh
        run: |
          ./scripts/agents/emit-execution-evidence.ps1 -DryRun `
            -RequestId 01J4YAZ0FJ8Q4V9WYD3S6BTPZ7 `
            -CorrelationId 01J4YAY7Q2M3N4P5R6S7T8V9W0 `
            -Outcome completed `
            -ProjectId iautos `
            -PrUrl https://github.com/sraphaz/iautos/pull/210 `
            -PrNumber 210

  validate-agent-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export Agent Graph
        shell: pwsh
        run: ./scripts/agents/export-agent-graph.ps1
      - name: Validate Agent Graph
        shell: pwsh
        run: ./scripts/harness/validate-agent-graph.ps1 -Target .
      # Regressão issue #40: coreografia com agentes type: domain deve produzir
      # nó 'domains' não-vazio no grafo exportado.
      - name: Domain agents exported (issue 40)
        shell: pwsh
        run: |
          $declared = (Select-String -Path .agents/choreography*.yaml -Pattern '^\s+type:\s*domain\s*$').Count
          $graph = Get-Content docs/_meta/agent-graph.generated.json -Raw | ConvertFrom-Json
          Write-Host "domain declarations in choreography: $declared"
          Write-Host "domains node in exported graph: $($graph.stats.domains)"
          if ($declared -gt 0 -and $graph.stats.domains -eq 0) {
            Write-Error 'choreography declares domain agents but exported graph has empty domains node'
            exit 1
          }

  schemas-yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse published schemas as standard YAML
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          failed = []
          files = sorted(
              glob.glob('schemas/**/*.yaml', recursive=True)
              + glob.glob('docs/schemas/**/*.yaml', recursive=True)
          )
          for path in files:
              try:
                  with open(path, encoding='utf-8') as fh:
                      list(yaml.safe_load_all(fh))
              except yaml.YAMLError as exc:
                  failed.append(path)
                  print(f'FAIL {path}: {exc}')
          if failed:
              print(f'{len(failed)} schema file(s) are not parseable as YAML')
              sys.exit(1)
          print(f'all {len(files)} schema files parse as YAML')
          EOF

  harness-sync-check:
    runs-on: ubuntu-latest
    if: vars.ARAH_HARNESS_PATH != ''
    steps:
      - uses: actions/checkout@v7
      - name: Check kernel drift
        shell: pwsh
        run: |
          if (Test-Path "${{ vars.ARAH_HARNESS_PATH }}/cli/sync-check.ps1") {
            & "${{ vars.ARAH_HARNESS_PATH }}/cli/sync-check.ps1" -Target $PWD
          } else {
            Write-Host "ARAH_HARNESS_PATH not configured — skip drift check"
          }
