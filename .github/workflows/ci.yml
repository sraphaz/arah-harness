name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: ARAH Harness self-test
        shell: pwsh
        run: ./scripts/self-test.ps1

  kernel-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Validate kernel package (H-15)
        run: |
          go build -o /tmp/arah ./cmd/arah
          /tmp/arah kernel verify -target .
          agents=$(find kernel/.agents -name '*.agent.yaml' | wc -l)
          skills=$(find kernel/.skills -name '*.skill.yaml' | wc -l)
          test "$agents" -ge 10
          test "$skills" -ge 15
          echo "kernel OK: $agents agents, $skills skills (verify green)"

  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check-jsonschema
        run: pip install check-jsonschema
      - name: Validate contract examples against schemas
        run: |
          set -euo pipefail
          for schema in schemas/contracts/*.schema.yaml; do
            name=$(basename "$schema" .schema.yaml)   # ex.: execution-request-1.0.0
            example="schemas/contracts/examples/${name}.example.yaml"
            test -f "$example" || { echo "missing example for $name"; exit 1; }
            check-jsonschema --schemafile "$schema" "$example"
          done
      - name: Invalid examples MUST be rejected by their schemas
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bad in schemas/contracts/examples/invalid/*.example.yaml; do
            base=$(basename "$bad")
            name=${base%%.invalid-*}                  # ex.: execution-request-1.1.0
            schema="schemas/contracts/${name}.schema.yaml"
            test -f "$schema" || { echo "missing schema for $bad"; exit 1; }
            if check-jsonschema --schemafile "$schema" "$bad" >/dev/null 2>&1; then
              echo "FAIL: expected $bad to be REJECTED by $schema"; exit 1
            fi
            echo "ok -- $bad rejected as expected"
          done
