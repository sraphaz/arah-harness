# knowledge-graph.schema.yaml — ponte ARAH ↔ provedor de knowledge graph (Graphify)
$schema: https://json-schema.org/draft/2020-12/schema
title: ARAH Knowledge Graph Manifest
type: object
required: [version, provider, status, generated_at]
properties:
  version:
    type: integer
    const: 1
  provider:
    type: string
    description: Nome do provedor (ex. graphify)
  provider_package:
    type: string
    description: Pacote de instalação (ex. graphifyy no PyPI)
  cli:
    type: string
    description: Comando CLI esperado
  mode:
    type: string
    enum: [code-only, full, status, unknown]
  status:
    type: string
    enum: [ready, skipped, missing, error]
  generated_at:
    type: string
    description: ISO-8601 UTC
  sibling_of:
    type: string
    description: Path do Agent Graph (não confundir)
  artifacts:
    type: object
    properties:
      graph: { type: string }
      report: { type: string }
      out_dir: { type: string }
  cli_detected:
    type: boolean
  notes:
    type: string
additionalProperties: true
